[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/source-api",
  "crates/relay",
  "crates/holochain-adapter",
  "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ConorTttttt/http_push"

[workspace.dependencies]
hc_push_protocol = { path = "crates/protocol" }
hc_push_source_api = { path = "crates/source-api" }
hc_push_holochain = { path = "crates/holochain-adapter" }
hc_push_relay = { path = "crates/relay" }
hc_push_client = { path = "crates/client" }

anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["limit", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
