[package]
name = "hc_push_device"
description = "Device-side catch-up helper: hands relay peer hints to the local conductor and measures Kitsune2 catch-up of the hinted ops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hc-push-device"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hc_push_holochain.workspace = true
hc_push_protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
holochain_client = { version = "=0.9.1", default-features = false }
holochain_conductor_api = "=0.7.1"
holochain_types = "=0.7.1"
kitsune2_api = "0.5"

[features]
# AppRequest::RequestGossipRound. Only compiles against the patched
# Holochain crates (upstream/holochain-0.7.1/); see
# scripts/build-patched-holochain.sh.
request-gossip-round = []
