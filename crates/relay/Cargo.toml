[package]
name = "hc_push_relay"
description = "HoloPort / EdgeNode HTTP push relay: change journal, subscriptions, SSE notifications and cursor-based sync for lightweight Holochain clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hc-push-relay"
path = "src/main.rs"

[features]
default = ["holochain"]
# Real conductor integration (holochain_client 0.9.x / Holochain 0.7.x).
holochain = ["dep:hc_push_holochain"]
# Event-driven `SystemSignal::OpsIntegrated` (needs the patched Holochain crates
# from upstream/; see docs/upstream-changes.md).
ops-integrated-signal = ["holochain", "hc_push_holochain/ops-integrated-signal"]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
hc_push_holochain = { workspace = true, optional = true }
hc_push_protocol.workspace = true
hc_push_source_api.workspace = true
hex.workspace = true
http-body.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
hc_push_client.workspace = true
reqwest.workspace = true
tempfile.workspace = true
